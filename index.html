
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地方選舉候選人資訊</title>

<style>
*{box-sizing:border-box}

html,body{
  scrollbar-width:none;
  -ms-overflow-style:none;
}
html::-webkit-scrollbar,
body::-webkit-scrollbar{
  display:none;
  width:0;
  height:0;
}
html{overflow-y:auto}
body{
  overflow-y:visible;
  overflow-x:hidden;
  margin:0;
  padding:20px;
  min-height:100vh;
  font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  color:#333;
  background:#fff;
}

.main-wrapper{
  width:100%;
  max-width:1600px;
  min-height:700px;
  margin:0 auto;
  border:1px solid #333;
  display:grid;
  grid-template-columns:280px 280px minmax(0,1fr);
  grid-template-rows:196px minmax(480px,auto);
  grid-template-areas:
    "intro intro results"
    "level role results";
}

.intro-area{
  grid-area:intro;
  padding:30px 28px;
  display:flex;
  align-items:flex-start;
  justify-content:flex-start;
  border-right:1px solid #333;
  min-width:0;
}
.intro-title{
  margin:0;
  font-size:32px;
  font-weight:700;
  line-height:1.5;
  letter-spacing:2px;
  white-space:nowrap;
}

.level-area{
  grid-area:level;
  padding:20px 28px 35px;
  border-right:1px solid #333;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:22px;
}
.role-area{
  grid-area:role;
  padding:20px 28px 35px;
  border-right:1px solid #333;
  display:flex;
  flex-direction:column;
  align-items:flex-start;

}
.section-title{

  font-weight:700;

}
.level-list,.role-list{

  flex-direction:column;

}

  color:#333;
  font-family:inherit;
  cursor:pointer;

}
.level-button{

  min-height:112px;
  padding:18px 10px;
  font-size:21px;
  font-weight:500;
}
.role-button{
  width:100%;

  padding:18px 10px;
  font-size:21px;

}
.level-button:hover,.role-button:hover,.region-card:hover{

}
.level-button.active,.role-button.active,.region-card.active{

.results-area{

}
.region-card{
  min-height:124px;

  font-size:19px;

  flex-direction:column;

.candidate-area{

}
.district-group{margin:18px 0 24px}
.district-title{
  margin:0 0 10px;
  padding-bottom:8px;
  border-bottom:1px solid #aaa;

  font-weight:700;
}
.candidate-list{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));

}
.candidate-card{
  width:100%;
  min-width:0;
  padding:15px 17px;
  border:1px solid #333;

  color:#333;

  gap:7px;

.candidate-card:hover{
  background:#f5f5f5;
  border-width:2px;
}
.candidate-card:focus-visible{
  outline:2px solid #333;

}

/* 候選人姓名：18.5px */
.candidate-name{
  font-size:18.5px;
  font-weight:700;
  line-height:1.4;
  overflow-wrap:anywhere;
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
}

/* 號次：沿用舊版黨籍字體大小 */
.candidate-draw-number-row{
  font-size:14px;
  line-height:1.5;
  font-weight:600;
  color:#555;
}

/* 候選人狀態標記 */
.candidate-status-tags{
  display:inline-flex;
  flex-wrap:wrap;
  align-items:center;
  gap:5px;
}
.candidate-status-tag{
  display:inline-block;
  padding:2px 7px;
  border:1px solid transparent;
  border-radius:2px;
  font-size:13px;
  line-height:1.25;
  font-weight:700;
  white-space:nowrap;
}
.candidate-status-tag.not-registered{
  color:#fff;
  background:#d9534f;
  border-color:#c94440;
}
.candidate-status-tag.uncontested{
  color:#29220a;
  background:#f4cf45;
  border-color:#d7ad20;
}
.candidate-status-tag.incumbent{
  color:#fff;
  background:#168fc8;
  border-color:#087db5;
}

/* 不得登記：卡片灰化 */
.candidate-card.is-not-registered{
  background:#e5e5e5;
  color:#777;
  opacity:.58;
  border-color:#aaa;
}
.candidate-card.is-not-registered:hover{
  background:#dedede;
  opacity:.72;
}
.candidate-card.is-not-registered .candidate-party,
.candidate-card.is-not-registered .candidate-meta,
.candidate-card.is-not-registered .candidate-note{
  color:#888;
}

/* 黨籍：沿用舊版14px */
.candidate-party{
  font-size:14px;
  line-height:1.5;
  color:#555;
  overflow-wrap:anywhere;
}
.candidate-meta{
  font-size:12px;
  color:#777;
  line-height:1.6;
}
.candidate-note{
  font-size:13px;
  color:#555;
  line-height:1.6;
}
.no-candidates{
  padding:22px 16px;
  border:1px solid #333;
  color:#666;
  line-height:1.8;
}

.candidate-detail{padding:24px 0 10px}
.detail-back{
  margin:0 0 24px;
  padding:10px 18px;
  border:1px solid #333;
  background:#fff;
  color:#333;
  font:inherit;

}
.detail-back:hover{background:#e0e0e0}
.detail-name{
  margin:0 0 12px;
  font-size:26px;
  font-weight:700;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
}
.detail-list{
  margin:0;
  border-top:1px solid #aaa;
}
.detail-row{
  display:grid;
  grid-template-columns:130px minmax(0,1fr);
  gap:16px;
  padding:16px 10px;
  border-bottom:1px solid #ddd;
  line-height:1.8;
}
.detail-label{font-weight:700}
.detail-value{overflow-wrap:anywhere}
.data-note{
  margin-top:24px;
  color:#777;
  font-size:12px;
  line-height:1.7;
}

/* 平板及較窄桌面 */

  .main-wrapper{grid-template-columns:230px 230px minmax(0,1fr)}
  .intro-title{font-size:28px}
  .level-area,.role-area{
    padding-left:18px;
    padding-right:18px;
  }
  .results-area{padding:30px 24px}
  .region-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* 手機及小型平板 */
@media(max-width:760px){
  body{padding:12px}
  .main-wrapper{
    grid-template-columns:1fr 1fr;
    grid-template-rows:auto auto auto;
    grid-template-areas:
      "intro intro"
      "level role"
      "results results";
  }
  .intro-area{
    min-height:125px;

    border-bottom:1px solid #333;
    padding:25px 20px;
  }
  .intro-title{font-size:27px}
  .level-area,.role-area{padding:25px 16px}
  .level-area{border-right:1px solid #333}
  .role-area{border-right:0}
  .role-button{

  }

  .candidate-list{grid-template-columns:1fr}
}

/* 手機 */
@media(max-width:480px){
  .intro-title{

<body>
<div class="main-wrapper">

  <section class="intro-area">
    <h1 class="intro-title">我想快速了解……</h1>
  </section>

  <section class="level-area">
    <h2 class="section-title">地方層級</h2>
    <div class="level-list">
      <button class="level-button" data-level="直轄市" type="button">直轄市</button>
      <button class="level-button" data-level="縣市" type="button">縣市</button>
      <button class="level-button" data-level="直轄市山地原住民區" type="button">直轄市山地原住民區</button>
    </div>
  </section>

  <section class="role-area">
    <h2 class="section-title">職位分類</h2>
    <div class="role-list">
      <button class="role-button" data-role="地方首長" type="button">地方首長</button>
      <button class="role-button" data-role="地方民意代表" type="button">地方民意代表</button>
    </div>
  </section>

  <section class="results-area">
    <h2 class="results-title">地區及候選人</h2>
    <div id="resultsContent">
      <div class="empty-message">
        請先選擇左側的地方層級及職位分類
        <br>
        系統將顯示符合條件的地區及候選人
      </div>
    </div>
    <p class="data-note">
      資料來源：中央選舉委員會115年地方公職人員選舉候選人登記名冊。
    </p>
  </section>

</div>

<script>
// ==========================================
// 一、Supabase 設定
// ==========================================

const SUPABASE_URL = "https://mvmkdhdhfpomgnsukxsh.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_rToUq4v8aQa7N1cotVj4zQ_H0mdRwRF";

const regionData = {
  "直轄市":[
    "臺北市","新北市","桃園市","臺中市","臺南市","高雄市"
  ],
  "縣市":[
    "基隆市","新竹市","嘉義市","新竹縣","苗栗縣","彰化縣",
    "南投縣","雲林縣","嘉義縣","屏東縣","宜蘭縣","花蓮縣",
    "臺東縣","澎湖縣","金門縣","連江縣"
  ],
  "直轄市山地原住民區":[
    "新北市烏來區","桃園市復興區","臺中市和平區",
    "高雄市桃源區","高雄市那瑪夏區","高雄市茂林區"
  ]
};

let records=[];
let selectedLevel="";
let selectedRole="";
let selectedRegion="";

const PAGE_SIZE=1000;
const resultsContent=document.getElementById("resultsContent");

// ==========================================
// 二、文字安全處理
// ==========================================

function escapeHTML(value){
  return String(value??"").replace(/[&<>"']/g,char=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[char]));
}

// ==========================================
// 三、抽籤號次排序
// ==========================================

function drawNumberSortValue(value){
  const text=String(value??"").trim();
  if(!text)return null;

  const circledDigits="⓪①②③④⑤⑥⑦⑧⑨⑩";
  if(circledDigits.includes(text)){
    return circledDigits.indexOf(text);
  }

  const match=text.match(/\d+/);
  return match?Number(match[0]):null;
}

function dateValue(value){
  const match=String(value||"").match(
    /(\d+)\s*[\/.-]\s*(\d+)\s*[\/.-]\s*(\d+)/
  );

  if(!match)return Number.MAX_SAFE_INTEGER;

  return (
    Number(match[1])*10000+
    Number(match[2])*100+
    Number(match[3])
  );
}

function compareCandidatesByDrawNumber(a,b){
  const numberA=drawNumberSortValue(a?.draw_number);
  const numberB=drawNumberSortValue(b?.draw_number);

  if(numberA!==null&&numberB===null)return -1;
  if(numberA===null&&numberB!==null)return 1;

  if(numberA!==null&&numberB!==null&&numberA!==numberB){
    return numberA-numberB;
  }

  const dateDifference=dateValue(a?.date)-dateValue(b?.date);
  if(dateDifference!==0)return dateDifference;

  return String(a?.name||"").localeCompare(
    String(b?.name||""),
    "zh-Hant"
  );
}

// ==========================================
// 四、讀取 Supabase 已發布候選人資料
// ==========================================

async function loadPublishedCandidates(){

  if(
    !SUPABASE_URL||
    !SUPABASE_ANON_KEY||
    SUPABASE_URL.startsWith("請填入_")||
    SUPABASE_ANON_KEY.startsWith("請填入_")
  ){
    throw new Error("尚未設定 Supabase URL 與 Publishable key。");
  }

  if(!window.supabase){
    throw new Error("Supabase 程式庫載入失敗，請重新整理網頁。");
  }

  const client=window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  const all=[];
  let from=0;

  while(true){
    const to=from+PAGE_SIZE-1;

    const {data,error}=await client
      .from("candidates")
      .select("id,created_at,published_data")
      .eq("is_published",true)
      .not("published_data","is",null)
      .order("created_at",{ascending:true})
      .order("id",{ascending:true})
      .range(from,to);

    if(error)throw error;

    const batch=data||[];

    batch.forEach(row=>{
      const publishedData=row.published_data;

      if(
        !publishedData||
        typeof publishedData!=="object"||
        Array.isArray(publishedData)
      ){
        return;
      }

      all.push({
        ...publishedData,
        _rowId:row.id
      });
    });

    if(batch.length<PAGE_SIZE)break;
    from+=PAGE_SIZE;
  }

  all.sort(compareCandidatesByDrawNumber);
  return all;
}

// ==========================================
// 五、候選人狀態標記與有效人數
// ==========================================

function isNotRegistered(candidate){
  const flags=Array.isArray(candidate.status_flags)
    ?candidate.status_flags:[];
  return flags.includes("not_registered");
}

function getCandidateStatusTags(candidate){
  const flags=Array.isArray(candidate.status_flags)
    ?candidate.status_flags:[];

  const definitions=[
    ["not_registered","不得登記","not-registered"],
    ["uncontested","同額競選","uncontested"],
    ["incumbent","現任者","incumbent"]
  ];

  return definitions
    .filter(([key])=>flags.includes(key))
    .map(([,label,className])=>
      `<span class="candidate-status-tag ${className}">${label}</span>`
    )
    .join("");
}

function getEligibleCount(list){
  return list.filter(candidate=>!isNotRegistered(candidate)).length;
}

// ==========================================
// 六、顯示地區及候選人
// ==========================================

function renderResults(){

  if(!selectedLevel||!selectedRole){
    resultsContent.innerHTML=`
      <div class="empty-message">
        請先完成地方層級及職位分類的選擇
        <br>
        即可瀏覽符合條件的地區及候選人
      </div>
    `;
    return;
  }

  const regions=regionData[selectedLevel]||[];

  let output=`
    <p class="region-hint">
      目前選擇：
      <strong>${escapeHTML(selectedLevel)}</strong>
      ／
      <strong>${escapeHTML(selectedRole)}</strong>
      <br>
      請選擇下列地區，查看候選人資訊。
    </p>
    <div class="region-grid">
  `;

  regions.forEach(region=>{
    const count=getEligibleCount(records.filter(candidate=>
      candidate.level===selectedLevel&&
      candidate.role===selectedRole&&
      candidate.region===region
    ));

    output+=`
      <button
        class="region-card ${selectedRegion===region?"active":""}"
        data-region="${escapeHTML(region)}"
        type="button"
      >
        <span>${escapeHTML(region)}</span>
        <span class="region-subtitle">
          ${count} 位候選人・查看名單
        </span>
      </button>
    `;
  });

  output+="</div>";

  if(selectedRegion){

    const candidates=records.filter(candidate=>
      candidate.level===selectedLevel&&
      candidate.role===selectedRole&&
      candidate.region===selectedRegion
    );

    output+=`
      <div class="candidate-area">
        <h3 class="candidate-heading">
          ${escapeHTML(selectedRegion)}｜${escapeHTML(selectedRole)}
        </h3>
        <p class="candidate-summary">
          有效候選人 ${getEligibleCount(candidates)} 位；
          不得登記 ${candidates.length-getEligibleCount(candidates)} 位。
          候選人依抽籤號次由小至大排列；未編號者列於最後。
        </p>
    `;

    if(candidates.length){

      const grouped=new Map();

      const sortedCandidates=[...candidates].sort(
        compareCandidatesByDrawNumber
      );

      sortedCandidates.forEach(candidate=>{
        const district=candidate.district||"未提供選舉區";

        if(!grouped.has(district)){
          grouped.set(district,[]);
        }

        grouped.get(district).push(candidate);
      });

      const sortedGroups=[...grouped.entries()].sort(
        ([districtA],[districtB])=>{
          const numberA=String(districtA).match(
            /第\s*(\d+)\s*選舉區/
          );
          const numberB=String(districtB).match(
            /第\s*(\d+)\s*選舉區/
          );

          if(numberA&&numberB){
            return Number(numberA[1])-Number(numberB[1]);
          }
          if(numberA)return -1;
          if(numberB)return 1;

          return String(districtA).localeCompare(
            String(districtB),
            "zh-Hant",
            {numeric:true,sensitivity:"base"}
          );
        }
      );

      for(const [district,people] of sortedGroups){

        output+=`
          <section class="district-group">
            <h4 class="district-title">
              ${escapeHTML(district)}
              （${getEligibleCount(people)} 位有效候選人）
            </h4>
            <div class="candidate-list">
        `;

        people.forEach(candidate=>{

          const statusTags=getCandidateStatusTags(candidate);
          const drawNumber=
            candidate.draw_number!==undefined&&
            String(candidate.draw_number).trim()!==""
              ?String(candidate.draw_number).trim()
              :"";

          const notes=[
            ...(Array.isArray(candidate.notes)?candidate.notes:[]),
            candidate.note||""
          ]
            .map(value=>String(value||"").trim())
            .filter(Boolean);

          output+=`
            <button
              class="candidate-card ${isNotRegistered(candidate)?"is-not-registered":""}"
              type="button"
              data-candidate-id="${escapeHTML(candidate._rowId)}"
              aria-label="查看${escapeHTML(candidate.name)}的候選人專屬資訊"
            >

              <div class="candidate-name">
                <span>${escapeHTML(candidate.name)}</span>
                ${statusTags
                  ?`<span class="candidate-status-tags">${statusTags}</span>`
                  :""}
              </div>

              ${drawNumber
                ?`<div class="candidate-draw-number-row">號次：${escapeHTML(drawNumber)}</div>`
                :""}

              <div class="candidate-party">
                ${escapeHTML(candidate.party||"未提供政黨")}
              </div>

              <div class="candidate-meta">
                ${escapeHTML(candidate.position||"未提供職位")}
                ｜登記日期：
                ${escapeHTML(candidate.date||"未提供")}
              </div>

              ${notes.length
                ?`<div class="candidate-note">${notes.map(escapeHTML).join("；")}</div>`
                :""}

            </button>
          `;
        });

        output+=`
            </div>
          </section>
        `;
      }

    }else{
      output+=`
        <div class="no-candidates">
          目前這個地區在所選職位分類中沒有候選人登記資料。
        </div>
      `;
    }

    output+="</div>";
  }

  resultsContent.innerHTML=output;

  // 地區按鈕事件
  resultsContent.querySelectorAll(".region-card").forEach(button=>{
    button.addEventListener("click",()=>{
      selectedRegion=
        selectedRegion===button.dataset.region
          ?""
          :button.dataset.region;
      renderResults();
    });
  });

  // 候選人卡片事件
  resultsContent.querySelectorAll(".candidate-card").forEach(button=>{
    button.addEventListener("click",()=>{
      const candidateId=button.dataset.candidateId;

      const candidate=records.find(
        item=>item._rowId===candidateId
      );

      if(!candidate)return;

      history.pushState(
        {candidateId},
        "",
        "#candidate-"+encodeURIComponent(candidateId)
      );

      renderCandidateDetail(candidateId);
    });
  });
}

// ==========================================
// 七、候選人專屬詳情頁
// ==========================================

function renderCandidateDetail(candidateId){

  const candidate=records.find(
    item=>item._rowId===candidateId
  );

  if(!candidate){
    renderResults();
    return;
  }

  const drawNumber=
    candidate.draw_number!==undefined&&
    String(candidate.draw_number).trim()!==""
      ?String(candidate.draw_number).trim()
      :"";

  const fields=[
    ["推薦政黨",candidate.party||"未提供政黨"],
    ["參選職位",candidate.position||"未提供"],
    ["選舉區",candidate.district||"未提供"],
    ["登記日期",candidate.date||"未提供"],
    [
      "狀態標記",
      (Array.isArray(candidate.status_flags)?candidate.status_flags:[])
        .map(flag=>({
          not_registered:"不得登記",
          uncontested:"同額競選",
          incumbent:"現任者"
        }[flag]||flag))
        .join("、")||"無"
    ],
    [
      "備註",
      [
        ...(Array.isArray(candidate.notes)?candidate.notes:[]),
        candidate.note||""
      ].filter(Boolean).join("、")||"無"
    ]
  ];

  resultsContent.innerHTML=`
    <div class="candidate-detail">

      <button
        class="detail-back"
        id="detailBack"
        type="button"
      >
        ← 返回候選人名單
      </button>

      <h3 class="detail-name">
        ${escapeHTML(candidate.name||"候選人資訊")}
        ${getCandidateStatusTags(candidate)}
      </h3>

      ${drawNumber
        ?`<div class="candidate-draw-number-row">號次：${escapeHTML(drawNumber)}</div>`
        :""}

      <div class="detail-list">
        ${fields.map(([label,value])=>`
          <div class="detail-row">
            <div class="detail-label">${escapeHTML(label)}</div>
            <div class="detail-value">${escapeHTML(value)}</div>
          </div>
        `).join("")}
      </div>
    </div>
  `;

  document.getElementById("detailBack").addEventListener(
    "click",
    ()=>{
      if(history.state&&history.state.candidateId){
        history.back();
      }else{
        history.replaceState(
          {},
          "",
          location.pathname+location.search
        );
        renderResults();
      }
    }
  );
}

// ==========================================
// 八、瀏覽器上一頁／下一頁
// ==========================================

function getCandidateIdFromHash(){
  const match=location.hash.match(/^#candidate-(.+)$/);
  if(!match)return null;

  try{
    return decodeURIComponent(match[1]);
  }catch(error){
    return null;
  }
}

window.addEventListener("popstate",()=>{
  const candidateId=getCandidateIdFromHash();

  if(candidateId){
    renderCandidateDetail(candidateId);
  }else{
    renderResults();
  }
});

// ==========================================
// 九、地方層級按鈕
// ==========================================

document.querySelectorAll(".level-button").forEach(button=>{
  button.addEventListener("click",()=>{

    if(selectedLevel===button.dataset.level){
      selectedLevel="";
      selectedRegion="";
      button.classList.remove("active");
    }else{
      selectedLevel=button.dataset.level;
      selectedRegion="";

      document.querySelectorAll(".level-button").forEach(item=>{
        item.classList.toggle("active",item===button);
      });
    }

    renderResults();
  });
});

// ==========================================
// 十、職位分類按鈕
// ==========================================

document.querySelectorAll(".role-button").forEach(button=>{
  button.addEventListener("click",()=>{

    if(selectedRole===button.dataset.role){
      selectedRole="";
      selectedRegion="";
      button.classList.remove("active");
    }else{
      selectedRole=button.dataset.role;
      selectedRegion="";

      document.querySelectorAll(".role-button").forEach(item=>{
        item.classList.toggle("active",item===button);
      });
    }

    renderResults();
  });
});

// ==========================================
// 十一、啟動網站
// ==========================================

async function startApp(){

  resultsContent.innerHTML=`
    <div class="empty-message">
      正在載入已發布的候選人資料…
    </div>
  `;

  try{
    records=await loadPublishedCandidates();
  }catch(error){
    console.error("候選人資料載入失敗：",error);

    resultsContent.innerHTML=`
      <div class="empty-message">
        目前無法載入候選人資料。
        <br>
        ${escapeHTML(error.message||error)}
      </div>
    `;
    return;
  }

  const initialCandidateId=getCandidateIdFromHash();

  if(initialCandidateId){

    const candidateExists=records.some(
      candidate=>candidate._rowId===initialCandidateId
    );

    if(candidateExists){
      history.replaceState(
        {candidateId:initialCandidateId},
        "",
        location.href
      );

      renderCandidateDetail(initialCandidateId);
      return;
    }else{
      history.replaceState(
        {},
        "",
        location.pathname+location.search
      );
    }
  }

  renderResults();
}

startApp();
</script>
</body>
</html>
