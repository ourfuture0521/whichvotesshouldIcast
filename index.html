
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地方選舉候選人資訊</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  color:#222;
  background:#fff;
}
body{min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
main{width:100%;max-width:1400px;margin:0 auto;padding:24px}
h1{font-size:28px;margin:0 0 8px}
.subtitle{font-size:14px;color:#666;margin:0 0 24px}
.selection-area{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin-bottom:24px;
}
.selection-panel{
  border:1px solid #333;
  padding:18px;
}
.selection-title{
  font-size:17px;
  font-weight:700;
  margin:0 0 12px;
}
.selection-options{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.selection-option{
  border:1px solid #333;
  background:#fff;
  color:#333;
  padding:9px 14px;
  min-height:40px;
}
.selection-option:hover{background:#f3f3f3}
.selection-option.active{
  background:#e0e0e0;
  border-color:#222;
  font-weight:700;
}
.results-panel{margin-top:22px}
.results-title{
  font-size:20px;
  margin:0 0 14px;
  padding-bottom:10px;
  border-bottom:1px solid #333;
}
.results-empty{
  border:1px solid #aaa;
  padding:18px;
  color:#777;
  line-height:1.8;
}
.region-list{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}
.region-card{
  border:1px solid #333;
  padding:14px;
  background:#fff;
  color:#333;
  text-align:left;
  width:100%;
}
.region-card:hover{background:#f3f3f3}
.region-name{font-weight:700;font-size:17px}
.region-count{font-size:13px;color:#666;margin-top:5px}
.candidate-area{margin-top:18px}
.candidate-heading{
  font-size:20px;
  margin:0 0 8px;
}
.candidate-summary{
  color:#666;
  font-size:14px;
  line-height:1.7;
  margin:0 0 16px;
}
.district-group{margin:18px 0 24px}
.district-title{
  margin:0 0 10px;
  padding-bottom:8px;
  border-bottom:1px solid #aaa;
  font-size:16px;
  font-weight:700;
}
.candidate-list{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.candidate-card{
  width:100%;
  min-width:0;
  padding:15px 17px;
  border:1px solid #333;
  background:#fff;
  color:#333;
  font-family:inherit;
  text-align:left;
  display:flex;
  flex-direction:column;
  gap:7px;
  cursor:pointer;
  transition:background .15s,border-width .15s;
}
.candidate-card:hover{
  background:#f5f5f5;
  border-width:2px;
}
.candidate-card:focus-visible{
  outline:2px solid #333;
  outline-offset:3px;
}
.candidate-name{
  font-size:20px;
  font-weight:700;
  overflow-wrap:anywhere;
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
}
.candidate-draw-number{
  display:inline-block;
  font-size:20px;
  line-height:1.2;
  font-weight:700;
  color:#333;
  background:transparent;
  border:0;
  padding:0;
}
.candidate-draw-number-row{
  font-size:20px;
  line-height:1.5;
  font-weight:600;
  color:#555;
}
.candidate-status-tags{
  display:inline-flex;
  flex-wrap:wrap;
  align-items:center;
  gap:5px;
}
.candidate-status-tag{
  display:inline-block;
  padding:2px 7px;
  border:1px solid transparent;
  border-radius:2px;
  font-size:20px;
  line-height:1.25;
  font-weight:700;
  white-space:nowrap;
}
.candidate-status-tag.not-registered{
  color:#fff;
  background:#d9534f;
  border-color:#c94440;
}
.candidate-status-tag.uncontested{
  color:#29220a;
  background:#f4cf45;
  border-color:#d7ad20;
}
.candidate-status-tag.incumbent{
  color:#fff;
  background:#168fc8;
  border-color:#087db5;
}
.candidate-card.is-not-registered{
  background:#e5e5e5;
  color:#777;
  opacity:.58;
  border-color:#aaa;
}
.candidate-card.is-not-registered:hover{
  background:#dedede;
  opacity:.72;
}
.candidate-card.is-not-registered .candidate-party,
.candidate-card.is-not-registered .candidate-meta,
.candidate-card.is-not-registered .candidate-note,
.candidate-card.is-not-registered .candidate-draw-number-row{
  color:#888;
}
.candidate-party{
  font-size:20px;
  color:#555;
  overflow-wrap:anywhere;
}
.candidate-meta{
  font-size:14px;
  color:#777;
  line-height:1.6;
}
.candidate-note{
  font-size:15px;
  color:#555;
  line-height:1.6;
}
.no-candidates{
  padding:22px 16px;
  border:1px solid #333;
  color:#666;
  line-height:1.8;
}
.candidate-detail{
  border:1px solid #333;
  padding:22px;
  background:#fff;
}
.detail-back{
  border:1px solid #333;
  background:#fff;
  padding:8px 13px;
  margin:0 0 20px;
}
.detail-back:hover{background:#eee}
.detail-name{
  font-size:24px;
  margin:0 0 18px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
}
.detail-list{
  border-top:1px solid #ddd;
}
.detail-row{
  display:grid;
  grid-template-columns:130px minmax(0,1fr);
  gap:15px;
  padding:13px 0;
  border-bottom:1px solid #ddd;
  line-height:1.7;
}
.detail-label{
  font-weight:700;
  color:#555;
}
.detail-value{
  overflow-wrap:anywhere;
}
@media(max-width:800px){
  main{padding:16px}
  .selection-area{grid-template-columns:1fr}
  .region-list{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:600px){
  h1{font-size:23px}
  .candidate-list{grid-template-columns:1fr}
  .region-list{grid-template-columns:1fr}
  .detail-row{grid-template-columns:1fr;gap:3px}
  .candidate-name{font-size:20px}
}
</style>
</head>
<body>
<main>
  <h1>地方選舉候選人資訊</h1>
  <p class="subtitle">查詢地方選舉候選人資料，了解各地區參選情形。</p>

  <div class="selection-area">
    <section class="selection-panel">
      <h2 class="selection-title">地方層級</h2>
      <div class="selection-options" id="levelOptions">
        <button class="selection-option" data-level="直轄市">直轄市</button>
        <button class="selection-option" data-level="縣市">縣市</button>
        <button class="selection-option" data-level="直轄市山地原住民區">直轄市山地原住民區</button>
        <button class="selection-option" data-level="鄉鎮市">鄉鎮市</button>
      </div>
    </section>

    <section class="selection-panel">
      <h2 class="selection-title">職位類別</h2>
      <div class="selection-options" id="roleOptions">
        <button class="selection-option" data-role="地方首長">地方首長</button>
        <button class="selection-option" data-role="地方民意代表">地方民意代表</button>
      </div>
    </section>
  </div>

  <section class="results-panel">
    <h2 class="results-title">地區及候選人</h2>
    <div id="resultsContent" class="results-empty">
      請先選擇地方層級及職位類別。
    </div>
  </section>
  <p class="subtitle">
    候選人資料依登記日期排序。<br>
    資料來源：中央選舉委員會115年地方公職人員選舉候選人登記名冊。
  </p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

// ==========================================
// 一、Supabase 設定
// ==========================================

const SUPABASE_URL = "https://mvmkdhdhfpomgnsukxsh.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_rToUq4v8aQa7N1cotVj4zQ_H0mdRwRF";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const resultsContent = document.getElementById("resultsContent");

let records = [];
let selectedLevel = "";
let selectedRole = "";

// ==========================================
// 二、共用函式
// ==========================================

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[char]));
}

function normalizeDrawNumber(value) {
  if (value === undefined || value === null) return null;
  const text = String(value).trim();
  if (!text) return null;

  const circled = {
    "①":"1","②":"2","③":"3","④":"4","⑤":"5",
    "⑥":"6","⑦":"7","⑧":"8","⑨":"9","⑩":"10",
    "⑪":"11","⑫":"12","⑬":"13","⑭":"14","⑮":"15",
    "⑯":"16","⑰":"17","⑱":"18","⑲":"19","⑳":"20",
    "㉑":"21","㉒":"22","㉓":"23","㉔":"24","㉕":"25",
    "㉖":"26","㉗":"27","㉘":"28","㉙":"29","㉚":"30"
  };

  if (circled[text]) return Number(circled[text]);

  const number = Number(text);
  return Number.isFinite(number) ? number : null;
}

function compareCandidatesByDrawNumber(a, b) {
  const numberA = normalizeDrawNumber(a.draw_number);
  const numberB = normalizeDrawNumber(b.draw_number);

  if (numberA === null && numberB === null) {
    return String(a.date || "").localeCompare(String(b.date || ""));
  }
  if (numberA === null) return 1;
  if (numberB === null) return -1;

  if (numberA !== numberB) return numberA - numberB;

  return String(a.date || "").localeCompare(String(b.date || ""));
}

function isNotRegistered(candidate) {
  const flags = Array.isArray(candidate.status_flags)
    ? candidate.status_flags
    : [];
  return flags.includes("not_registered");
}

function getCandidateStatusTags(candidate) {
  const flags = Array.isArray(candidate.status_flags)
    ? candidate.status_flags
    : [];

  const labels = {
    not_registered:["不得登記","not-registered"],
    uncontested:["同額競選","uncontested"],
    incumbent:["現任者","incumbent"]
  };

  return flags.map(flag => {
    if (!labels[flag]) return "";
    const [label,className] = labels[flag];
    return `<span class="candidate-status-tag ${className}">${label}</span>`;
  }).join("");
}

function getEligibleCount(list) {
  return list.filter(candidate => !isNotRegistered(candidate)).length;
}

// ==========================================
// 三、讀取 Supabase 已發布候選人資料
// ==========================================

async function loadCandidates() {
  resultsContent.textContent = "正在載入候選人資料……";

  try {
    let allRows = [];
    const pageSize = 1000;
    let from = 0;

    while (true) {
      const {data,error} = await supabaseClient
        .from("candidates")
        .select("id,published_data,is_published")
        .eq("is_published",true)
        .not("published_data","is",null)
        .order("created_at",{ascending:true})
        .range(from,from + pageSize - 1);

      if (error) throw error;

      const batch = data || [];
      allRows = allRows.concat(batch);

      if (batch.length < pageSize) break;
      from += pageSize;
    }

    records = allRows.map(row => {
      const data = row.published_data || {};
      return {
        ...data,
        _rowId:row.id
      };
    });

    renderResults();

    const hashId = getCandidateIdFromHash();
    if (hashId) renderCandidateDetail(hashId);

  } catch (error) {
    console.error(error);
    resultsContent.textContent =
      "候選人資料載入失敗，請稍後重新整理頁面。錯誤："+error.message;
  }
}

// ==========================================
// 四、選擇條件
// ==========================================

document.querySelectorAll("[data-level]").forEach(button => {
  button.addEventListener("click",() => {
    const value = button.dataset.level;
    selectedLevel = selectedLevel === value ? "" : value;

    document.querySelectorAll("[data-level]").forEach(item => {
      item.classList.toggle("active",item.dataset.level === selectedLevel);
    });

    renderResults();
  });
});

document.querySelectorAll("[data-role]").forEach(button => {
  button.addEventListener("click",() => {
    const value = button.dataset.role;
    selectedRole = selectedRole === value ? "" : value;

    document.querySelectorAll("[data-role]").forEach(item => {
      item.classList.toggle("active",item.dataset.role === selectedRole);
    });

    renderResults();
  });
});

// ==========================================
// 五、顯示地區及候選人
// ==========================================

function renderResults() {
  if (!selectedLevel || !selectedRole) {
    resultsContent.className = "results-empty";
    resultsContent.textContent = "請選擇地方層級及職位類別，即可瀏覽符合條件的地區及候選人。";
    return;
  }

  const matching = records.filter(candidate =>
    candidate.level === selectedLevel &&
    candidate.role === selectedRole
  );

  if (!matching.length) {
    resultsContent.className = "results-empty";
    resultsContent.textContent = "目前沒有符合條件的候選人資料。";
    return;
  }

  const regions = [...new Set(matching.map(candidate => candidate.region || "未提供地區"))]
    .sort((a,b) => a.localeCompare(b,"zh-Hant"));

  resultsContent.className = "";
  resultsContent.innerHTML = `
    <div class="region-list">
      ${regions.map(region => {
        const people = matching.filter(candidate =>
          (candidate.region || "未提供地區") === region
        );
        const count = getEligibleCount(people);

        return `
          <button class="region-card" type="button" data-region="${escapeHTML(region)}">
            <div class="region-name">${escapeHTML(region)}</div>
            <div class="region-count">${count} 位有效候選人・查看名單</div>
          </button>
        `;
      }).join("")}
    </div>
    <div id="regionCandidates"></div>
  `;

  resultsContent.querySelectorAll("[data-region]").forEach(button => {
    button.addEventListener("click",() => {
      renderRegionCandidates(button.dataset.region);
    });
  });
}

function renderRegionCandidates(region) {
  const matching = records.filter(candidate =>
    candidate.level === selectedLevel &&
    candidate.role === selectedRole &&
    (candidate.region || "未提供地區") === region
  );

  const sortedCandidates = [...matching].sort(compareCandidatesByDrawNumber);

  const grouped = new Map();

  sortedCandidates.forEach(candidate => {
    const district = candidate.district || "未提供選舉區";
    if (!grouped.has(district)) grouped.set(district,[]);
    grouped.get(district).push(candidate);
  });

  let output = `
    <div class="candidate-area">
      <h3 class="candidate-heading">${escapeHTML(region)}候選人</h3>
      <p class="candidate-summary">
        有效候選人 ${getEligibleCount(matching)} 位；不得登記 ${matching.length - getEligibleCount(matching)} 位。<br>
        候選人依抽籤號次由小至大排列；未編號者列於最後。
      </p>
  `;

  grouped.forEach((people,district) => {
    output += `
      <section class="district-group">
        <h4 class="district-title">
          ${escapeHTML(district)}（${getEligibleCount(people)} 位有效候選人）
        </h4>
        <div class="candidate-list">
    `;

    people.forEach(candidate => {
      const drawNumber = candidate.draw_number !== undefined &&
        String(candidate.draw_number).trim() !== ""
          ? `<div class="candidate-draw-number-row">編號：${escapeHTML(candidate.draw_number)}</div>`
          : "";

      const notes = [
        ...(Array.isArray(candidate.notes) ? candidate.notes : []),
        candidate.note || ""
      ].map(value => String(value || "").trim()).filter(Boolean);

      output += `
        <button
          class="candidate-card ${isNotRegistered(candidate) ? "is-not-registered" : ""}"
          type="button"
          data-candidate-id="${escapeHTML(candidate._rowId)}"
          aria-label="查看${escapeHTML(candidate.name)}的候選人專屬資訊"
        >
          <div class="candidate-name">
            <span>${escapeHTML(candidate.name)}</span>
            ${getCandidateStatusTags(candidate)}
          </div>

          ${drawNumber}

          <div class="candidate-party">
            ${escapeHTML(candidate.party || "未提供政黨")}
          </div>

          <div class="candidate-meta">
            ${escapeHTML(candidate.position || "未提供職位")}
            ｜登記日期：${escapeHTML(candidate.date || "未提供")}
          </div>

          ${notes.length
            ? `<div class="candidate-note">${notes.map(escapeHTML).join("；")}</div>`
            : ""}
        </button>
      `;
    });

    output += `
        </div>
      </section>
    `;
  });

  output += `</div>`;

  const container = document.getElementById("regionCandidates");
  if (container) {
    container.innerHTML = output;

    container.querySelectorAll("[data-candidate-id]").forEach(button => {
      button.addEventListener("click",() => {
        const candidateId = button.dataset.candidateId;

        history.pushState(
          {candidateId},
          "",
          "#candidate-" + encodeURIComponent(candidateId)
        );

        renderCandidateDetail(candidateId);
      });
    });
  }
}

// ==========================================
// 六、候選人專屬詳情頁
// ==========================================

function renderCandidateDetail(candidateId) {
  const candidate = records.find(item => item._rowId === candidateId);

  if (!candidate) {
    renderResults();
    return;
  }

  const fields = [
    ["姓名",candidate.name || "未提供"],
    ["編號",candidate.draw_number !== undefined &&
      String(candidate.draw_number).trim() !== ""
        ? String(candidate.draw_number)
        : "未編號"],
    ["推薦政黨",candidate.party || "未提供政黨"],
    ["參選職位",candidate.position || "未提供"],
    ["選舉區",candidate.district || "未提供"],
    ["登記日期",candidate.date || "未提供"],
    ["狀態標記",(Array.isArray(candidate.status_flags)
      ? candidate.status_flags
      : []).map(flag => ({
        not_registered:"不得登記",
        uncontested:"同額競選",
        incumbent:"現任者"
      }[flag] || flag)).join("、") || "無"],
    ["備註",[
      ...(Array.isArray(candidate.notes) ? candidate.notes : []),
      candidate.note || ""
    ].filter(Boolean).join("、") || "無"]
  ];

  resultsContent.innerHTML = `
    <div class="candidate-detail">
      <button class="detail-back" id="detailBack" type="button">
        ← 返回候選人名單
      </button>

      <h3 class="detail-name">
        ${escapeHTML(candidate.name || "候選人資訊")}
        ${getCandidateStatusTags(candidate)}
      </h3>

      <div class="detail-list">
        ${fields.map(([label,value]) => `
          <div class="detail-row">
            <div class="detail-label">${escapeHTML(label)}</div>
            <div class="detail-value">${escapeHTML(value)}</div>
          </div>
        `).join("")}
      </div>
    </div>
  `;

  document.getElementById("detailBack").addEventListener("click",() => {
    if (history.state && history.state.candidateId) {
      history.back();
    } else {
      history.replaceState({},"",location.pathname + location.search);
      renderResults();
    }
  });
}

// ==========================================
// 七、瀏覽器上一頁／下一頁
// ==========================================

function getCandidateIdFromHash() {
  const match = location.hash.match(/^#candidate-(.+)$/);
  if (!match) return null;

  try {
    return decodeURIComponent(match[1]);
  } catch {
    return null;
  }
}

window.addEventListener("popstate",() => {
  const candidateId = getCandidateIdFromHash();

  if (candidateId) {
    renderCandidateDetail(candidateId);
  } else {
    renderResults();
  }
});

window.addEventListener("hashchange",() => {
  const candidateId = getCandidateIdFromHash();

  if (candidateId) {
    renderCandidateDetail(candidateId);
  }
});

// ==========================================
// 八、啟動
// ==========================================

async function startApp() {
  await loadCandidates();
}

startApp();

</script>
</body>
</html>
